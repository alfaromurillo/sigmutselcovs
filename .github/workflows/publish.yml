name: Publish to PyPI

# No longer blocked on sigmutsel reaching PyPI first: this package
# dropped its sigmutsel dependency 2026-08-13 (GENCODE GTFs are now
# fetched/cached directly, see download.ensure_gencode_gtf, instead
# of read from sigmutsel's bundled copy). Triggered by publishing a
# GitHub release.

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
