name: Publish to PyPI

# Dormant until sigmutsel is published to PyPI (this package
# depends on it, and PyPI does not allow VCS dependencies in
# uploaded distributions). Once sigmutsel is on PyPI, drop the
# git+https install line from tests.yml, pin sigmutsel's floor
# in pyproject.toml, and this workflow is ready to use as-is:
# triggered by publishing a GitHub release.

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
