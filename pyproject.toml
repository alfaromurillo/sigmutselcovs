[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmutselcovs"
version = "0.1.0"
authors = [
    {name = "Jorge Alfaro-Murillo", email = "jorge.alfaro@ucr.ac.cr"},
]
description = "Covariate matrix builders for sigmutsel"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=10.0.0",
    "requests>=2.28.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pyBigWig",
    "sigmutsel",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black==25.12.0",
    "ruff>=0.1.0",
]

[project.scripts]
sigmutselcovs = "sigmutselcovs.cli:main"

[project.urls]
Homepage = "https://github.com/alfaromurillo/sigmutselcovs"
Repository = "https://github.com/alfaromurillo/sigmutselcovs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sigmutselcovs = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit external services (deselected by default)",
    "slow: long-running tests",
]
addopts = "-m 'not network'"

[tool.black]
line-length = 70
target-version = ['py312']

[tool.ruff]
line-length = 70
